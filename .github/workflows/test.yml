name: Test

# 实际流程全在 kamalyes/deploy-pipeline 的 go-library-test.yml 里，所有 go-* 库共用一份
# 改那一份就等于改所有库，不必在三十来个仓库里逐个同步
#
# [EN] The pipeline itself lives in go-library-test.yml in kamalyes/deploy-pipeline and is
# shared by every go-* library, so one edit there reaches all of them

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  test:
    uses: kamalyes/deploy-pipeline/.github/workflows/go-library-test.yml@master
    # go.mod 的 go 指令是 1.25.0，所以矩阵最低只能到 1.25.x
    # 本地已验证 1.25.14 / 1.26.2 / 1.27.3 三个工具链下 build + vet 均通过
    # [EN] go.mod declares go 1.25.0, so 1.25.x is the floor this matrix can honestly claim
    with:
      go-versions: '["1.25.x", "1.26.x", "1.27.x"]'
    secrets:
      # 显式映射而非 secrets: inherit —— inherit 跨账号调用时拿不到值，
      # 显式映射在同账号与跨账号下都成立
      # [EN] Mapped explicitly rather than with secrets: inherit, which yields nothing when the
      # caller and the reusable workflow live under different accounts
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
